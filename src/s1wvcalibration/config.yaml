# Default configuration for s1wvcalibration.
#
# This file replaces the legacy ``shared_information`` module. All cluster
# specific paths and calibration constants live here so that the library can be
# installed anywhere and pointed at the right data with a local override.
#
# A user-site ``localconfig.yaml`` (see ``config.py``) can override any key
# without touching this file. Keys are merged shallowly: a top-level key in the
# override replaces the whole sub-mapping.

# ---------------------------------------------------------------------------
# Data locations
# ---------------------------------------------------------------------------
paths:
  # Root of the MPC-Sentinel1 project tree (datarmor legacy).
  project_dir: /home/datawork-cersat-public/cache/project/mpc-sentinel1
  # Where the per-SAFE NetCDF calibration files are written.
  analysis_dir: /home/datawork-cersat-public/cache/project/mpc-sentinel1/analysis/s1_data_analysis
  # ECMWF 0.100 deg hourly wind fields (nomenclature: light or full).
  ecmwf_0100_light: /home/datawork-cersat-public/provider/ecmwf/forecast/hourly/0100deg/netcdf_light
  ecmwf_0100_full: /home/datawork-cersat-public/provider/ecmwf/forecast/hourly/0100deg/netcdf_full
  # ECMWF 0.125 deg 3-hourly wind fields (METEOFRANCE_CEP_*.nc).
  ecmwf_0125: /home/datawork-cersat-public/archive/provider/ecmwf/model/forecast_0125/netcdf
  # Land mask (mwf-ers-mask.nc lives in this directory).
  land_mask: /home/datawork-cersat-public/cache/public/ftp/project/landmask
  # Deep-learning WV texture classification (DL_Summary.xml per date).
  classif_wv_cls: /home/datawork-cersat-public/cache/public/ftp/project/deeplearning
  # WW3 spectra colocated with L2 S1 (for significant-wave-height bias).
  ww3_coloc: /home/datawork-cersat-public/cache/project/mpc-sentinel1/data/colocation

# ---------------------------------------------------------------------------
# Calibration parameters
# ---------------------------------------------------------------------------
calibration:
  # |lat| above this (deg) is treated as marginal ice and rejected.
  high_lat_threshold: 50
  # Center wind speed (m/s) for the "classical" and "noise-free" sweet spots.
  wind_ranges:
    classical: 7
    noise_free: 10
  # Number of imagettes processed in --dev mode.
  dev_max_measu: 3
  # NetCDF time reference.
  time_unit: "seconds since 2014-01-01 00:00:00"

# ---------------------------------------------------------------------------
# GMF model (xsarsea)
# ---------------------------------------------------------------------------
gmf:
  # Optional path to the xsarsea LUTs NetCDF. When absent/empty xsarsea
  # downloads the LUTs automatically.
  nc_luts_path: ""

# ---------------------------------------------------------------------------
# Satellite acronym -> ESA product directory name
# ---------------------------------------------------------------------------
satellites:
  S1A: sentinel-1a
  S1B: sentinel-1b
  S1C: sentinel-1c
  S1D: sentinel-1d
