# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Conda build (not uv): the project runtime deps pull GDAL (via xsar/xsarsea),
# which cannot be built from source on RTD. The conda-forge base env provides a
# prebuilt GDAL, so RTD's project install and the pip installs below see it as
# already satisfied (same recipe as the CI checks job,
# ci/requirements/environment.rtd.yml). `conda` and `build` are top-level keys
# in the v2 schema.

version: 2

build:
  os: ubuntu-24.04
  commands:
    - pip install "xsar[s1]" xsarsea
    - pip install -e . --no-deps
    - pip install "sphinx>=7.0" "myst_parser>=0.13" sphinx_copybutton
      sphinx_autodoc_typehints "furo>=2023.08.17"
    - sphinx-build -T -b html -d docs/_build/doctrees -D language=en docs
      $READTHEDOCS_OUTPUT/html

conda:
  environment: ci/requirements/environment.rtd.yml
