name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this variable to be set to any value.
  # Set it to 3 to support 8-bit color graphics (256 colors per channel)
  # for libraries that care about the value set.
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v7

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GDAL (pulled by xsar/xsarsea) cannot be built from source in CI, so the
      # geospatial stack is installed from conda-forge where GDAL is prebuilt.
      # xsar / xsarsea are NOT on conda-forge, so they are pip-installed next;
      # pip sees the conda-provided GDAL as already satisfied and does not try
      # to rebuild it. This mirrors the documented HPC recipe (pyproject.toml).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: s1wvci
          create-args: >-
            py=${{ matrix.python-version }} pip gdal dask xarray numpy scipy
            matplotlib netcdf4 h5netcdf h5py pyyaml
          init-shell: bash
          cache-environment: true

      - name: Install geospatial readers (sdist-only, not on conda-forge)
        run: micromamba run -n s1wvci pip install "xsar[s1]" xsarsea

      - name: Install package
        run: micromamba run -n s1wvci pip install -e . --no-deps

      - name: Install test tools
        run:
          micromamba run -n s1wvci pip install pytest pytest-cov pytest-timeout

      - name: Test package
        run: >-
          micromamba run -n s1wvci pytest -ra --cov --cov-report=xml
          --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
