# Default configuration for s1wvcalibration.
#
# This file replaces the legacy ``shared_information`` module. All cluster
# specific paths and calibration constants live here so that the library can be
# installed anywhere and pointed at the right data with a local override.
#
# A user-site ``localconfig.yaml`` (see ``config.py``) can override any key
# without touching this file. Merging is deep: a mapping in the override is
# merged into the default mapping key by key, so overriding only
# ``paths.root_directory`` keeps the other path defaults.

# ---------------------------------------------------------------------------
# Data locations
# ---------------------------------------------------------------------------
# Every data location is expressed *relative* to ``root_directory`` (the single
# machine-specific value). To move the library to another cluster, override only
# ``root_directory`` in a ``localconfig.yaml`` (or ``$S1WVCALIB_CONFIG``); the
# relative sub-paths below stay unchanged. A sub-path may also be given as an
# absolute path to escape the root when a location does not follow the layout.
paths:
  # Root of the data tree (datarmor layout). Override this for other clusters.
  root_directory: /home/datawork-cersat-public
  # Root of the MPC-Sentinel1 project tree.
  project_dir: cache/project/mpc-sentinel1
  # Where the per-SAFE NetCDF calibration files are written.
  analysis_dir: cache/project/mpc-sentinel1/analysis/s1_data_analysis
  # ECMWF 0.100 deg hourly wind fields (nomenclature: light or full).
  ecmwf_0100_light: provider/ecmwf/forecast/hourly/0100deg/netcdf_light
  ecmwf_0100_full: provider/ecmwf/forecast/hourly/0100deg/netcdf_full
  # ECMWF 0.125 deg 3-hourly wind fields (METEOFRANCE_CEP_*.nc).
  ecmwf_0125: archive/provider/ecmwf/model/forecast_0125/netcdf
  # Land mask (mwf-ers-mask.nc lives in this directory).
  land_mask: cache/public/ftp/project/landmask
  # Deep-learning WV texture classification (DL_Summary.xml per date).
  classif_wv_cls: cache/public/ftp/project/deeplearning
  # WW3 spectra colocated with L2 S1 (for significant-wave-height bias).
  ww3_coloc: cache/project/mpc-sentinel1/data/colocation
  # "SATGLOB" WW3 reconstruction output (L2, non-default procedure).
  ww3_satglob: /home/cercache/users/agrouaze/temporaire/sentinel1/coloc

# ---------------------------------------------------------------------------
# Calibration parameters
# ---------------------------------------------------------------------------
calibration:
  # |lat| above this (deg) is treated as marginal ice and rejected.
  high_lat_threshold: 50
  # Center wind speed (m/s) for the "classical" and "noise-free" sweet spots.
  wind_ranges:
    classical: 7
    noise_free: 10
  # Number of imagettes processed in --dev mode.
  dev_max_measu: 3
  # NetCDF time reference.
  time_unit: "seconds since 2014-01-01 00:00:00"

# ---------------------------------------------------------------------------
# GMF model (xsarsea)
# ---------------------------------------------------------------------------
gmf:
  # Optional path to the xsarsea LUTs NetCDF. When absent/empty xsarsea
  # downloads the LUTs automatically.
  nc_luts_path: ""

# ---------------------------------------------------------------------------
# Satellite acronym -> ESA product directory name
# ---------------------------------------------------------------------------
satellites:
  S1A: sentinel-1a
  S1B: sentinel-1b
  S1C: sentinel-1c
  S1D: sentinel-1d
