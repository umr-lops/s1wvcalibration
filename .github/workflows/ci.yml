name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this variable to be set to any value.
  # Set it to 3 to support 8-bit color graphics (256 colors per channel)
  # for libraries that care about the value set.
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v7

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GDAL (pulled by xsar/xsarsea) cannot be built from source in CI, so the
      # geospatial stack comes from conda-forge where GDAL is prebuilt.
      # xsar / xsarsea are NOT on conda-forge, so they are pip-installed next;
      # pip sees the conda-provided GDAL as already satisfied and does not try
      # to rebuild it. This mirrors the documented HPC recipe (pyproject.toml).
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci/requirements/environment.yaml
          environment-name: s1wvci
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}
          post-cleanup: "none"

      - name: Install geospatial readers (sdist-only, not on conda-forge)
        run: pip install "xsar[s1]" xsarsea

      - name: Install package
        run: pip install -e . --no-deps

      - name: Test package
        run: >-
          pytest -ra --cov --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fail the job when the upload itself errors (e.g. missing token)
          # instead of silently passing with no data uploaded.
          fail_ci_if_error: true
