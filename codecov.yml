# Codecov configuration (https://docs.codecov.com/docs/codecov-yaml)
#
# The parity tests (L1 / end-to-end NetCDF) are skipped when the HPC data
# tree is not mounted, so the uploaded coverage is the "core" coverage. Keep
# the reporting simple and non-blocking: Codecov is informational here, the
# authoritative signal is the CI checks job.

codecov:
  require_ci_to_pass: false
  max_report_age: 2592000 # 30 days

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "header, diff"
  require_changes: false
