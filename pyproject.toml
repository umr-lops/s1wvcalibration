[build-system]
requires = ["flit_scm", "flit_core>=3.11"]
build-backend = "flit_scm:buildapi"


[project]
name = "s1wvcalibration"
authors = [
  { name = "Antoine Grouazel", email = "antoine.grouazel@ifremer.fr" },
]
description = "Geophysical calibration of Sentinel-1 Wave Mode (WV) observations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
# NOTE: xsar and xsarsea pull GDAL (and h5netcdf/h5py). On HPC clusters they are
# best installed from conda-forge (micromamba) where GDAL is prebuilt, e.g.:
#   micromamba create -n s1wvcalib -c conda-forge python=3.12 xsar xsarsea
# pip install of the package itself then works with --no-deps for those two.
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "xarray",
  "netCDF4",
  "h5netcdf",
  "pyyaml",
  "xsar",
  "xsarsea",
]

[project.urls]
Homepage = "https://github.com/umr-lops/s1wvcalibration"
"Bug Tracker" = "https://github.com/umr-lops/s1wvcalibration/issues"
Changelog = "https://github.com/umr-lops/s1wvcalibration/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
  "pytest-timeout >=2",
  "ruff >=0.9.0",
]
dev = [
  { include-group = "test" },
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]


[tool.setuptools_scm]
write_to = "src/s1wvcalibration/_version.py"


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = [
  "error",
  # xsar/xarray internals raise deprecation warnings (e.g. drop -> drop_vars)
  # that are outside our control; do not fail the suite on them.
  "ignore:dropping variables using `drop` is deprecated:FutureWarning",
  "ignore:Casting complex values to real discards the imaginary part:Warning",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["s1wvcalibration"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
disallow_any_unimported = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "s1wvcalibration.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = "type-arg"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true




[tool.ruff]

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "DTZ",    # flake8-datetimez
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
   "TRY003",    # Long exception messages
    "EM102",     # F-strings in exceptions
    "TRY300",    # Return in try block
    "PERF203",   # Try-except in loop
    "BLE001",    # Blind exception (déjà discuté)
]


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.10"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]

[project.scripts]
s1wvcalib = "s1wvcalibration.calibration:entrypoint"
